<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Estilizado</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="card">
        <img src="./caixa.png" alt="Imagem do produto" class="card-imagem">

        <button class="card-botao">Comprar agora</button>
        </div>
</body>
</html>
